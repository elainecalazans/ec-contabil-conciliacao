<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protótipos · Autopilot — Visão do Operador</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --brand-pink:#f25461; --brand-pink-soft:#fde7ea; --surface:#fff; --surface-muted:#f7f7f8; --text-primary:#18181b; --text-secondary:#52525b; --text-tertiary:#a1a1aa; --border:#e4e4e7; }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{font-family:'Inter',system-ui,sans-serif;background:var(--surface-muted);color:var(--text-primary);margin:0;font-size:14px;}
  .hub{max-width:1000px;margin:0 auto;padding:48px 32px;}
  .hub-eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--brand-pink);margin-bottom:10px;}
  .hub h1{font-size:28px;font-weight:700;margin:0 0 8px;}
  .hub-sub{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:32px;max-width:620px;}
  .section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-primary);margin:26px 0 12px;}
  
  /* Ajustado para uma única coluna centralizada no fluxo de conciliação */
  .areas{display:grid;grid-template-columns: 1fr; max-width: 400px; gap:44px; margin-bottom:8px;}
  .area{position:relative;display:flex;flex-direction:column;}
  .area .section-label{margin:0 0 12px;}
  
  .col-cards{display:flex;flex-direction:column;gap:12px;}
  .card{display:flex;flex-direction:column;min-height:158px;text-decoration:none;background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .15s,box-shadow .15s,transform .1s;}
  .card.live:hover{border-color:var(--brand-pink);box-shadow:0 4px 14px rgba(0,0,0,0.06);transform:translateY(-1px);}
  
  .ic{width:34px;height:34px;border-radius:9px;background:var(--brand-pink-soft);color:var(--brand-pink);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .ic svg{width:18px;height:18px;}
  .ic.contabil{background:#eff6ff;color:#2563eb;}
  
  .t{font-size:14.5px;font-weight:700;margin-bottom:4px;line-height:1.3;}
  .d{font-size:12.5px;color:var(--text-secondary);line-height:1.45;flex:1;}
  
  .tag{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:11.5px;font-weight:600;color:var(--brand-pink);}
  .tag.contabil-tag{color:#2563eb;}
  .card .tag svg{width:13px;height:13px;}
</style>
</head>
<body>
  <div class="hub">
    <div class="hub-eyebrow">Autopilot · Visão do Operador</div>
    <h1>Protótipos</h1>
    <p class="hub-sub">Acesse abaixo o fluxo para realizar as tratativas e a validação de lançamentos no processo de conciliação.</p>

    <div class="areas">
      <div class="area">
        <div class="section-label">Operação Contábil</div>
        <div class="col-cards">
          <a class="card live" href="contabil-conciliacao.html">
            <div class="ic contabil"><i data-lucide="landmark"></i></div>
            <div class="t">Conciliação de Extratos</div>
            <div class="d">Ambiente para cruzamento de dados, validação de extratos e tratamento de exceções.</div>
            <div class="tag contabil-tag">Abrir fluxo <i data-lucide="arrow-right"></i></div>
          </a>
        </div>
      </div>
    </div>

  </div>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
